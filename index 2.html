<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>ฝึกจำ ป.อ. ม.59–87</title>

<style>
/* Layout: sticky tab bar, one-column reading/practice area, section chips for scope */
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2433;--mute:#667085;--line:#dde3ec;--red:#c00000;--redbg:#fde8e8;--navy:#1f3a5f;--navyfg:#fff;--ok:#1f7a4d;--okbg:#e2f4ea;--warn:#a15c00;--warnbg:#fdf0d8;--blank:#e7ebf2;
--serif:"Noto Serif Thai","Noto Sans Thai",serif;--sans:"Noto Sans Thai",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151e;--card:#182030;--ink:#e6ebf4;--mute:#97a3b8;--line:#2a3548;--red:#ff7b7b;--redbg:#3a1d22;--navy:#8fb4e8;--navyfg:#10151e;--ok:#6fd49f;--okbg:#17342a;--warn:#f0b659;--warnbg:#3a2d14;--blank:#2a3548;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151e;--card:#182030;--ink:#e6ebf4;--mute:#97a3b8;--line:#2a3548;--red:#ff7b7b;--redbg:#3a1d22;--navy:#8fb4e8;--navyfg:#10151e;--ok:#6fd49f;--okbg:#17342a;--warn:#f0b659;--warnbg:#3a2d14;--blank:#2a3548;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
header{padding:20px 0 8px}
h1{font-family:var(--serif);font-size:1.5rem;margin:0;line-height:1.3;text-wrap:balance}
header p{margin:2px 0 0;color:var(--mute);font-size:.88rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;display:flex;gap:6px;border-bottom:1px solid var(--line)}
.bar button{flex:1;font:inherit;font-weight:500;padding:8px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.bar button[aria-selected=true]{background:var(--navy);color:var(--navyfg);border-color:var(--navy)}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;font-size:.88rem;color:var(--mute)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1 1 100%}
.meter i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chip{font:inherit;font-size:.82rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--navy);color:var(--navyfg);border-color:var(--navy)}
.chip.l1{border-color:var(--red)}.chip.l3{border-color:var(--ok)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.sh b{font-family:var(--serif);font-size:1.05rem}
.sh span{color:var(--mute);font-size:.8rem;margin-left:auto}
.v{display:inline-block;font-size:.72rem;font-weight:500;background:var(--navy);color:var(--navyfg);padding:0 8px;border-radius:4px;margin-right:6px;line-height:1.6;vertical-align:1px}
.sec p{margin:6px 0}
.r{color:var(--red);font-weight:700}
.b{display:inline-block;min-width:3.2em;background:var(--blank);border-bottom:2px solid var(--mute);border-radius:3px;color:transparent;cursor:pointer;user-select:none;padding:0 4px;font:inherit}
.b.on{background:var(--redbg);border-color:var(--red);color:var(--red);font-weight:700}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{font:inherit;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--navy);color:var(--navyfg);border-color:var(--navy)}
.btn.g{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.btn.w{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.hint{color:var(--mute);font-size:.84rem;margin:0 0 12px}
.lv{font-size:.76rem;padding:0 8px;border-radius:4px;background:var(--blank);color:var(--mute)}
.lv.l1{background:var(--redbg);color:var(--red)}.lv.l3{background:var(--okbg);color:var(--ok)}.lv.l2{background:var(--warnbg);color:var(--warn)}
.fc{font-size:1.05rem}
.fc .q{font-family:var(--serif);font-size:1.3rem;margin:4px 0 10px}
.pbar{font-size:.84rem;color:var(--mute);margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:10px 14px;margin:0 0 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--redbg);border-color:var(--red);color:var(--red)}
.q2{font-family:var(--serif);font-size:1.05rem;margin:0 0 10px}
.fill{display:inline-block;min-width:4em;border-bottom:2px solid var(--navy);text-align:center;color:var(--navy);font-weight:700}
.fill.ok{color:var(--ok);border-color:var(--ok)}.fill.no{color:var(--red);border-color:var(--red)}
.ex{display:none;margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--bg);border:1px dashed var(--line)}
.ex.on{display:block}
.ex h4{margin:12px 0 2px;font-size:.95rem;color:var(--navy)}.ex h4:first-child{margin-top:0}
.ex p{margin:2px 0;font-size:.94rem}
.eg{margin:6px 0;padding:6px 10px;border-left:3px solid var(--navy);font-size:.9rem;color:var(--mute)}
.tip{margin-top:12px;padding:8px 10px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:.88rem}
.tw{overflow-x:auto;margin-top:12px}.tw table{border-collapse:collapse;font-size:.85rem;min-width:520px}.tw td,.tw th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.tw th{background:var(--blank)}
.xb{margin-left:auto;font:inherit;font-size:.8rem;padding:2px 12px;border-radius:99px;border:1px solid var(--navy);background:none;color:var(--navy);cursor:pointer}
.xb[aria-expanded=true]{background:var(--navy);color:var(--navyfg)}
.foot{margin-top:28px;font-size:.8rem;color:var(--mute)}
.reset{font:inherit;font-size:.8rem;background:none;border:none;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">
<header><h1>ฝึกจำ ประมวลกฎหมายอาญา ม.59–87</h1><p>ตัวบทเต็ม คำสำคัญสีแดง แบ่งตามวรรค</p></header>
<div class="bar" role="tablist" id="tabs">
<button role="tab" data-m="read" aria-selected="true">อ่าน</button>

</div>
<div class="stats" id="stats"></div>

<div id="main"></div>
<p class="foot">ตัวบทรวบรวมจากเว็บไซต์ ควรตรวจกับ krisdika.go.th ก่อนสอบ · ม.84 ลำดับวรรคยังไม่ยืนยัน · <button class="reset" id="rs">ล้างความคืบหน้า</button></p>
</div>
<script>
const D=[{"n":"59","t":"เจตนา / ประมาท","u":"หน่วย ๒","p":["บุคคลจะต้องรับผิดในทางอาญาก็ต่อเมื่อได้[[กระทำโดยเจตนา]] [[เว้นแต่จะได้กระทำโดยประมาท]] ในกรณีที่กฎหมายบัญญัติให้ต้องรับผิดเมื่อได้[[กระทำโดยประมาท]] หรือเว้นแต่ในกรณีที่กฎหมายบัญญัติไว้โดยแจ้งชัดให้ต้องรับผิดแม้ได้กระทำโดยไม่มีเจตนา","[[กระทำโดยเจตนา]] ได้แก่กระทำโดย[[รู้สำนึกในการที่กระทำ]] และในขณะเดียวกันผู้กระทำ[[ประสงค์ต่อผล]] หรือย่อม[[เล็งเห็นผล]]ของการกระทำนั้น","ถ้าผู้กระทำ[[มิได้รู้ข้อเท็จจริงอันเป็นองค์ประกอบของความผิด]] จะถือว่าผู้กระทำ[[ประสงค์ต่อผล]] หรือย่อม[[เล็งเห็นผล]]ของการกระทำนั้นมิได้","[[กระทำโดยประมาท]] ได้แก่กระทำความผิดมิใช่โดยเจตนา แต่กระทำโดย[[ปราศจากความระมัดระวัง]]ซึ่งบุคคลในภาวะเช่นนั้นจักต้องมี[[ตามวิสัยและพฤติการณ์]] และผู้กระทำ[[อาจใช้ความระมัดระวังเช่นว่านั้นได้]] แต่หาได้ใช้ให้เพียงพอไม่","การกระทำ ให้หมายความรวมถึงการให้เกิดผลอันหนึ่งอันใดขึ้นโดย[[งดเว้นการที่จักต้องกระทำเพื่อป้องกันผลนั้น]]ด้วย"]},{"n":"60","t":"พลาด","u":"หน่วย ๒","p":["ผู้ใด[[เจตนาที่จะกระทำต่อบุคคลหนึ่ง]] แต่ผลของการกระทำ[[เกิดแก่อีกบุคคลหนึ่งโดยพลาดไป]] ให้[[ถือว่าผู้นั้นกระทำโดยเจตนาแก่บุคคลซึ่งได้รับผลร้าย]]จากการกระทำนั้น แต่ในกรณีที่กฎหมายบัญญัติให้ลงโทษหนักขึ้น เพราะฐานะของบุคคลหรือเพราะความสัมพันธ์ระหว่างผู้กระทำกับบุคคลที่ได้รับผลร้าย [[มิให้นำกฎหมายนั้นมาใช้บังคับเพื่อลงโทษผู้กระทำให้หนักขึ้น]]"]},{"n":"61","t":"สำคัญผิดในตัวบุคคล","u":"หน่วย ๒","p":["ผู้ใดเจตนาจะกระทำต่อบุคคลหนึ่ง แต่[[ได้กระทำต่ออีกบุคคลหนึ่งโดยสำคัญผิด]] ผู้นั้น[[จะยกเอาความสำคัญผิดเป็นข้อแก้ตัวว่ามิได้กระทำโดยเจตนาหาได้ไม่]]"]},{"n":"62","t":"สำคัญผิดในข้อเท็จจริง","u":"หน่วย ๒","p":["ข้อเท็จจริงใด ถ้ามีอยู่จริงจะทำให้การกระทำไม่เป็นความผิด หรือทำให้ผู้กระทำไม่ต้องรับโทษ หรือได้รับโทษน้อยลง [[แม้ข้อเท็จจริงนั้นจะไม่มีอยู่จริง แต่ผู้กระทำสำคัญผิดว่ามีอยู่จริง]] ผู้กระทำย่อม[[ไม่มีความผิด หรือได้รับยกเว้นโทษ หรือได้รับโทษน้อยลง]] แล้วแต่กรณี","ถ้าความไม่รู้ข้อเท็จจริงตามความในวรรคสามแห่งมาตรา ๕๙ หรือความสำคัญผิดว่ามีอยู่จริงตามความในวรรคแรก ได้[[เกิดขึ้นด้วยความประมาทของผู้กระทำความผิด]] [[ให้ผู้กระทำรับผิดฐานกระทำโดยประมาท]] ในกรณีที่กฎหมายบัญญัติไว้โดยเฉพาะว่า การกระทำนั้นผู้กระทำจะต้องรับโทษแม้กระทำโดยประมาท","บุคคลจะต้องรับโทษหนักขึ้นโดยอาศัยข้อเท็จจริงใด [[บุคคลนั้นจะต้องได้รู้ข้อเท็จจริงนั้น]]"]},{"n":"63","t":"ผลที่หนักขึ้นต้องเป็นผลธรรมดา","u":"หน่วย ๒","p":["ถ้าผลของการกระทำความผิดใดทำให้ผู้กระทำต้องรับ[[โทษหนักขึ้น]] ผลของการกระทำความผิดนั้น[[ต้องเป็นผลที่ตามธรรมดาย่อมเกิดขึ้นได้]]"]},{"n":"64","t":"ไม่รู้กฎหมาย","u":"ไม่พบในสไลด์","p":["บุคคล[[จะแก้ตัวว่าไม่รู้กฎหมายเพื่อให้พ้นจากความรับผิดในทางอาญาไม่ได้]] แต่ถ้าศาลเห็นว่า ตามสภาพและพฤติการณ์ ผู้กระทำความผิดอาจจะไม่รู้ว่ากฎหมายบัญญัติว่าการกระทำนั้นเป็นความผิด ศาลอาจอนุญาตให้แสดงพยานหลักฐานต่อศาล และถ้าศาลเชื่อว่า ผู้กระทำไม่รู้ว่ากฎหมายบัญญัติไว้เช่นนั้น ศาลจะ[[ลงโทษน้อยกว่าที่กฎหมายกำหนดไว้สำหรับความผิดนั้นเพียงใดก็ได้]]"]},{"n":"65","t":"วิกลจริต","u":"หน่วย ๔","p":["ผู้ใดกระทำความผิด ในขณะ[[ไม่สามารถรู้ผิดชอบ หรือไม่สามารถบังคับตนเองได้เพราะมีจิตบกพร่อง โรคจิตหรือจิตฟั่นเฟือน]] [[ผู้นั้นไม่ต้องรับโทษสำหรับความผิดนั้น]]","แต่ถ้าผู้กระทำความผิด[[ยังสามารถรู้ผิดชอบอยู่บ้าง หรือยังสามารถบังคับตนเองได้บ้าง]] ผู้นั้นต้องรับโทษสำหรับความผิดนั้น แต่ศาลจะ[[ลงโทษน้อยกว่าที่กฎหมายกำหนดไว้สำหรับความผิดนั้นเพียงใดก็ได้]]"]},{"n":"66","t":"มึนเมา","u":"หน่วย ๔","p":["ความมึนเมาเพราะเสพสุราหรือสิ่งเมาอย่างอื่น[[จะยกขึ้นเป็นข้อแก้ตัวตามมาตรา ๖๕ ไม่ได้]] เว้นแต่ความมึนเมานั้นจะได้เกิดโดย[[ผู้เสพไม่รู้ว่าสิ่งนั้นจะทำให้มึนเมา]] หรือได้เสพโดย[[ถูกขืนใจให้เสพ]] และได้กระทำความผิดในขณะ[[ไม่สามารถรู้ผิดชอบ หรือไม่สามารถบังคับตนเองได้]] ผู้กระทำความผิดจึงจะ[[ได้รับยกเว้นโทษ]]สำหรับความผิดนั้น","แต่ถ้าผู้นั้น[[ยังสามารถรู้ผิดชอบอยู่บ้าง หรือยังสามารถบังคับตนเองได้บ้าง]] ศาลจะ[[ลงโทษน้อยกว่าที่กฎหมายกำหนดไว้สำหรับความผิดนั้นเพียงใดก็ได้]]"]},{"n":"67","t":"จำเป็น","u":"หน่วย ๔","p":["ผู้ใดกระทำความผิดด้วยความจำเป็น\n(๑) เพราะ[[อยู่ในที่บังคับ หรือภายใต้อำนาจซึ่งไม่สามารถหลีกเลี่ยงหรือขัดขืนได้]] หรือ\n(๒) เพื่อให้ตนเองหรือผู้อื่นพ้นจาก[[ภยันตรายที่ใกล้จะถึง]]และ[[ไม่สามารถหลีกเลี่ยงให้พ้นโดยวิธีอื่นใดได้]] เมื่อภยันตรายนั้น[[ตนมิได้ก่อให้เกิดขึ้นเพราะความผิดของตน]]\nถ้าการกระทำนั้น[[ไม่เป็นการเกินสมควรแก่เหตุ]]แล้ว [[ผู้นั้นไม่ต้องรับโทษ]]"]},{"n":"68","t":"ป้องกัน","u":"หน่วย ๔","p":["ผู้ใด[[จำต้องกระทำ]]การใดเพื่อป้องกันสิทธิของตนหรือของผู้อื่นให้พ้น[[ภยันตรายซึ่งเกิดจากการประทุษร้ายอันละเมิดต่อกฎหมาย]] และ[[เป็นภยันตรายที่ใกล้จะถึง]] ถ้าได้กระทำ[[พอสมควรแก่เหตุ]] การกระทำนั้นเป็นการป้องกันโดยชอบด้วยกฎหมาย [[ผู้นั้นไม่มีความผิด]]"]},{"n":"69","t":"เกินสมควร","u":"หน่วย ๔","p":["ในกรณีที่บัญญัติไว้ในมาตรา ๖๗ และมาตรา ๖๘ นั้น ถ้าผู้กระทำได้กระทำไป[[เกินสมควรแก่เหตุ]] หรือ[[เกินกว่ากรณีแห่งความจำเป็น]] หรือ[[เกินกว่ากรณีแห่งการจำต้องกระทำเพื่อป้องกัน]] ศาลจะ[[ลงโทษน้อยกว่าที่กฎหมายกำหนดไว้สำหรับความผิดนั้นเพียงใดก็ได้]] แต่ถ้าการกระทำนั้นเกิดขึ้นจาก[[ความตื่นเต้น ความตกใจ หรือความกลัว]] [[ศาลจะไม่ลงโทษผู้กระทำก็ได้]]"]},{"n":"70","t":"สั่งตามหน้าที่","u":"หน่วย ๔","p":["ผู้ใด[[กระทำตามคำสั่งของเจ้าพนักงาน]] แม้คำสั่งนั้นจะมิชอบด้วยกฎหมาย ถ้าผู้กระทำ[[มีหน้าที่หรือเชื่อโดยสุจริตว่ามีหน้าที่ต้องปฏิบัติตาม]] [[ผู้นั้นไม่ต้องรับโทษ]] [[เว้นแต่จะรู้ว่าคำสั่งนั้นเป็นคำสั่งซึ่งมิชอบด้วยกฎหมาย]]"]},{"n":"71","t":"ญาติ / สามีภริยา","u":"หน่วย ๔","p":["ความผิดตามที่บัญญัติไว้ในมาตรา ๓๓๔ ถึงมาตรา ๓๓๖ วรรคแรก และมาตรา ๓๔๑ ถึงมาตรา ๓๖๔ นั้น ถ้าเป็นการกระทำที่[[สามีกระทำต่อภริยา หรือภริยากระทำต่อสามี]] [[ผู้กระทำไม่ต้องรับโทษ]]","ความผิดดังระบุมานี้ ถ้าเป็นการกระทำที่[[ผู้บุพการีกระทำต่อผู้สืบสันดาน ผู้สืบสันดานกระทำต่อผู้บุพการี หรือพี่หรือน้องร่วมบิดามารดาเดียวกันกระทำต่อกัน]] แม้กฎหมายมิได้บัญญัติให้เป็นความผิดอันยอมความได้ [[ก็ให้เป็นความผิดอันยอมความได้]] และนอกจากนั้น ศาลจะ[[ลงโทษน้อยกว่าที่กฎหมายกำหนดไว้สำหรับความผิดนั้นเพียงใดก็ได้]]"]},{"n":"72","t":"บันดาลโทสะ","u":"หน่วย ๔","p":["ผู้ใด[[บันดาลโทสะ]]โดย[[ถูกข่มเหงอย่างร้ายแรง]]ด้วย[[เหตุอันไม่เป็นธรรม]] จึงกระทำความผิด[[ต่อผู้ข่มเหงในขณะนั้น]] [[ศาลจะลงโทษผู้นั้นน้อยกว่าที่กฎหมายกำหนดไว้สำหรับความผิดนั้นเพียงใดก็ได้]]"]},{"n":"73","t":"เด็กไม่เกิน ๑๒ ปี","u":"หน่วย ๔","p":["เด็ก[[อายุยังไม่เกินสิบสองปี]] กระทำการอันกฎหมายบัญญัติเป็นความผิด [[เด็กนั้นไม่ต้องรับโทษ]]","ให้พนักงานสอบสวนส่งตัวเด็กตามวรรคหนึ่งให้[[พนักงานเจ้าหน้าที่ตามกฎหมายว่าด้วยการคุ้มครองเด็ก]] เพื่อดำเนินการคุ้มครองสวัสดิภาพตามกฎหมายว่าด้วยการนั้น"]},{"n":"74","t":"เด็กกว่า ๑๒ ปี แต่ไม่เกิน ๑๕ ปี","u":"หน่วย ๔","p":["เด็ก[[อายุกว่าสิบสองปีแต่ยังไม่เกินสิบห้าปี]] กระทำการอันกฎหมายบัญญัติเป็นความผิด [[เด็กนั้นไม่ต้องรับโทษ]] แต่ให้ศาลมีอำนาจที่จะดำเนินการ ดังต่อไปนี้\n(๑) [[ว่ากล่าวตักเตือนเด็กนั้นแล้วปล่อยตัวไป]] และถ้าศาลเห็นสมควรจะเรียกบิดา มารดา ผู้ปกครอง หรือบุคคลที่เด็กนั้นอาศัยอยู่มาตักเตือนด้วยก็ได้\n(๒) ถ้าศาลเห็นว่าบิดา มารดา หรือผู้ปกครองสามารถดูแลเด็กนั้นได้ ศาลจะมีคำสั่งให้[[มอบตัวเด็กนั้นให้แก่บิดา มารดา หรือผู้ปกครอง]]ไป โดยวางข้อกำหนดให้ระวังเด็กนั้นไม่ให้ก่อเหตุร้ายตลอดเวลาที่ศาลกำหนด ซึ่งต้อง[[ไม่เกินสามปี]]และกำหนดจำนวนเงินตามที่เห็นสมควร ซึ่งจะต้องชำระต่อศาล[[ไม่เกินครั้งละหนึ่งหมื่นบาท]] ในเมื่อเด็กนั้นก่อเหตุร้ายขึ้น\n(๓) [[ส่งตัวเด็กนั้นไปยังสถานศึกษา หรือสถานฝึกและอบรม หรือสถานแนะนำทางจิต]] หรือสถานที่ซึ่งจัดตั้งขึ้นเพื่อฝึกและอบรมเด็ก ตลอดระยะเวลาที่ศาลกำหนด แต่[[ไม่ให้เกินกว่าวันที่เด็กนั้นจะมีอายุครบสิบแปดปี]]","ในกรณีที่ศาลมอบตัวเด็กให้แก่บิดา มารดา ผู้ปกครอง หรือบุคคลที่เด็กนั้นอาศัยอยู่ตาม (๒) ศาลจะกำหนดเงื่อนไขเพื่อคุมความประพฤติเด็กนั้นเช่นเดียวกับที่บัญญัติไว้ในมาตรา ๕๖ ด้วยก็ได้ ในกรณีเช่นว่านี้ ให้ศาลแต่งตั้งพนักงานคุมประพฤติหรือพนักงานอื่นใดเพื่อคุมความประพฤติเด็กนั้น","ในกรณีที่เด็กนั้นไม่มีบิดา มารดา หรือผู้ปกครอง หรือมีแต่ศาลเห็นว่าไม่สามารถดูแลเด็กนั้นได้ หรือในกรณีที่เด็กอาศัยอยู่กับบุคคลอื่นนอกจากบิดา มารดา หรือผู้ปกครอง และบุคคลนั้นไม่ยอมรับข้อกำหนดดังกล่าวใน (๒) ศาลจะมีคำสั่งให้มอบตัวเด็กนั้นให้อยู่กับบุคคลหรือองค์การที่ศาลเห็นสมควร เพื่อดูแล อบรม และสั่งสอนตามระยะเวลาที่ศาลกำหนดก็ได้ในเมื่อบุคคลหรือองค์การนั้นยินยอม ในกรณีเช่นว่านี้ ให้บุคคลหรือองค์การนั้นมีอำนาจเช่นผู้ปกครองเฉพาะเพื่อดูแล อบรม และสั่งสอน รวมตลอดถึงการกำหนดที่อยู่และการจัดให้เด็กมีงานทำตามสมควร หรือให้ดำเนินการคุ้มครองสวัสดิภาพเด็กตามกฎหมายว่าด้วยการนั้นก็ได้","คำสั่งของศาลดังกล่าวใน (๒) (๓) วรรคสอง และวรรคสามนั้น ถ้าในขณะใดภายในระยะเวลาที่ศาลกำหนดไว้ ความปรากฏแก่ศาลโดยศาลรู้เองหรือตามคำเสนอของผู้มีส่วนได้เสีย พนักงานอัยการ หรือบุคคลหรือองค์การที่ศาลมอบตัวเด็กเพื่อดูแล อบรม และสั่งสอน หรือเจ้าพนักงานว่าพฤติการณ์เกี่ยวกับคำสั่งนั้นได้เปลี่ยนแปลงไป ก็ให้ศาลมีอำนาจเปลี่ยนแปลงแก้ไขคำสั่งนั้นหรือมีคำสั่งใหม่ตามอำนาจในมาตรานี้"]},{"n":"75","t":"อายุกว่า ๑๕ ปี แต่ต่ำกว่า ๑๘ ปี","u":"ไม่พบในสไลด์","p":["ผู้ใด[[อายุกว่าสิบห้าปีแต่ต่ำกว่าสิบแปดปี]] กระทำการอันกฎหมายบัญญัติเป็นความผิด ให้ศาลพิจารณาถึงความรู้ผิดชอบและสิ่งอื่นทั้งปวงเกี่ยวกับผู้นั้น ในอันที่จะควรวินิจฉัยว่าสมควรพิพากษาลงโทษผู้นั้นหรือไม่ [[ถ้าศาลเห็นว่าไม่สมควรพิพากษาลงโทษก็ให้จัดการตามมาตรา ๗๔]] หรือถ้าศาลเห็นว่าสมควรพิพากษาลงโทษ ก็ให้[[ลดมาตราส่วนโทษที่กำหนดไว้สำหรับความผิดลงกึ่งหนึ่ง]]"]},{"n":"76","t":"อายุ ๑๘–๒๐ ปี","u":"ไม่พบในสไลด์","p":["ผู้ใด[[อายุตั้งแต่สิบแปดปีแต่ยังไม่เกินยี่สิบปี]] กระทำการอันกฎหมายบัญญัติเป็นความผิด ถ้าศาลเห็นสมควรจะ[[ลดมาตราส่วนโทษที่กำหนดไว้สำหรับความผิดนั้นลงหนึ่งในสามหรือกึ่งหนึ่งก็ได้]]"]},{"n":"77","t":"ข้อกำหนดตาม ม.๗๔ (๒)","u":"ไม่พบในสไลด์","p":["ในกรณีที่ศาลวางข้อกำหนดให้บิดามารดา ผู้ปกครองหรือบุคคลที่เด็กนั้นอาศัยอยู่ ระวังเด็กนั้นไม่ให้ก่อเหตุร้ายตามความในมาตรา ๗๔ (๒) ถ้าเด็กนั้นก่อเหตุร้ายขึ้นภายในเวลาในข้อกำหนด ศาลมีอำนาจบังคับบิดามารดา ผู้ปกครองหรือบุคคลที่เด็กนั้นอาศัยอยู่ [[ให้ชำระเงินไม่เกินจำนวนในข้อกำหนดนั้น]] ภายในเวลาที่ศาลเห็นสมควร ถ้าไม่ชำระเงิน ศาลจะสั่งให้[[ยึดทรัพย์สิน]]เพื่อใช้เงินที่จะต้องชำระก็ได้","ในกรณีที่ศาลได้บังคับให้ชำระเงินตามข้อกำหนดแล้วนั้น ถ้าศาลมิได้เปลี่ยนแปลงแก้ไขคำสั่งที่ได้วางข้อกำหนดนั้นเป็นอย่างอื่นตามความในมาตรา ๗๔ วรรคท้าย ก็ให้ข้อกำหนดนั้นคงใช้บังคับได้ต่อไป จนสิ้นเวลาที่กำหนดไว้ในข้อกำหนดนั้น"]},{"n":"78","t":"บรรเทาโทษ","u":"ไม่พบในสไลด์","p":["เมื่อปรากฏว่ามีเหตุบรรเทาโทษ ไม่ว่าจะได้มีการเพิ่มหรือการลดโทษตามบทบัญญัติแห่งประมวลกฎหมายนี้หรือกฎหมายอื่นแล้วหรือไม่ ถ้าศาลเห็นสมควรจะ[[ลดโทษไม่เกินกึ่งหนึ่ง]]ของโทษที่จะลงแก่ผู้กระทำความผิดนั้นก็ได้","เหตุบรรเทาโทษนั้น ได้แก่ผู้กระทำความผิดเป็น[[ผู้โฉดเขลาเบาปัญญา]] [[ตกอยู่ในความทุกข์อย่างสาหัส]] [[มีคุณความดีมาแต่ก่อน]] [[รู้สึกความผิดและพยายามบรรเทาผลร้ายแห่งความผิดนั้น]] [[ลุแก่โทษต่อเจ้าพนักงานหรือให้ความรู้แก่ศาลอันเป็นประโยชน์แก่การพิจารณา]] หรือเหตุอื่นที่ศาลเห็นว่ามีลักษณะทำนองเดียวกัน"]},{"n":"79","t":"โทษปรับสถานเดียว","u":"ไม่พบในสไลด์","p":["ในคดีที่มี[[โทษปรับสถานเดียว]] ถ้าผู้ที่ต้องหาว่ากระทำความผิด[[นำค่าปรับในอัตราอย่างสูงสำหรับความผิดนั้นมาชำระก่อนที่ศาลเริ่มต้นสืบพยาน]] ให้[[คดีนั้นเป็นอันระงับไป]]"]},{"n":"80","t":"พยายาม","u":"หน่วย ๓","p":["ผู้ใด[[ลงมือกระทำความผิดแต่กระทำไปไม่ตลอด]] หรือ[[กระทำไปตลอดแล้วแต่การกระทำนั้นไม่บรรลุผล]] ผู้นั้น[[พยายามกระทำความผิด]]","ผู้ใด[[พยายามกระทำความผิด]] ผู้นั้นต้องระวางโทษ[[สองในสามส่วน]]ของโทษที่กฎหมายกำหนดไว้สำหรับความผิดนั้น"]},{"n":"81","t":"พยายามที่ไม่อาจบรรลุผลได้แน่แท้","u":"หน่วย ๓","p":["ผู้ใด[[กระทำการโดยมุ่งต่อผลซึ่งกฎหมายบัญญัติเป็นความผิด]] แต่การกระทำนั้น[[ไม่สามารถจะบรรลุผลได้อย่างแน่แท้]] เพราะ[[เหตุปัจจัยซึ่งใช้ในการกระทำ]]หรือ[[เหตุแห่งวัตถุที่มุ่งหมายกระทำต่อ]] ให้ถือว่าผู้นั้นพยายามกระทำความผิด แต่ให้[[ลงโทษไม่เกินกึ่งหนึ่ง]]ของโทษที่กฎหมายกำหนดไว้สำหรับความผิดนั้น","ถ้าการกระทำดังกล่าวในวรรคแรกได้กระทำไปโดย[[ความเชื่ออย่างงมงาย]] [[ศาลจะไม่ลงโทษก็ได้]]"]},{"n":"82","t":"ยับยั้ง / กลับใจ","u":"หน่วย ๓","p":["ผู้ใดพยายามกระทำความผิด หาก[[ยับยั้งเสียเองไม่กระทำการให้ตลอด]] หรือ[[กลับใจแก้ไขไม่ให้การกระทำนั้นบรรลุผล]] ผู้นั้น[[ไม่ต้องรับโทษสำหรับการพยายามกระทำความผิดนั้น]] แต่ถ้าการที่ได้กระทำไปแล้วต้องตามบทกฎหมายที่บัญญัติเป็นความผิด ผู้นั้น[[ต้องรับโทษสำหรับความผิดนั้น ๆ]]"]},{"n":"83","t":"ตัวการ","u":"หน่วย ๕","p":["ในกรณีความผิดใดเกิดขึ้นโดยการกระทำของ[[บุคคลตั้งแต่สองคนขึ้นไป]] ผู้ที่ได้[[ร่วมกระทำความผิดด้วยกัน]]นั้นเป็น[[ตัวการ]] ต้องระวางโทษตามที่กฎหมายกำหนดไว้สำหรับความผิดนั้น"]},{"n":"84","t":"ผู้ใช้","u":"หน่วย ๕","p":["ผู้ใดก่อให้ผู้อื่นกระทำความผิดไม่ว่าด้วยการ[[ใช้ บังคับ ขู่เข็ญ จ้าง วานหรือยุยงส่งเสริม]] หรือด้วยวิธีอื่นใด ผู้นั้นเป็น[[ผู้ใช้ให้กระทำความผิด]]","ถ้าความผิดมิได้กระทำลงไม่ว่าจะเป็นเพราะผู้ถูกใช้ไม่ยอมกระทำ ยังไม่ได้กระทำ หรือเหตุอื่นใด ผู้ใช้ต้องระวางโทษเพียง[[หนึ่งในสามของโทษ]]ที่กำหนดไว้สำหรับความผิดนั้น","ถ้าผู้ถูกใช้ได้กระทำความผิดนั้น ผู้ใช้ต้องรับโทษ[[เสมือนเป็นตัวการ]] และถ้าผู้ถูกใช้เป็นบุคคล[[อายุไม่เกินสิบแปดปี]] ผู้พิการ ผู้ทุพพลภาพ ลูกจ้างหรือผู้ที่อยู่ใต้บังคับบัญชาของผู้ใช้ ผู้ที่มีฐานะยากจน หรือผู้ต้องพึ่งพาผู้ใช้เพราะเหตุป่วยเจ็บหรือไม่ว่าทางใด ให้[[เพิ่มโทษที่จะลงแก่ผู้ใช้กึ่งหนึ่ง]]ของโทษที่ศาลกำหนดสำหรับผู้นั้น"]},{"n":"85","t":"ประกาศ / โฆษณา","u":"ไม่พบในสไลด์","p":["ผู้ใด[[โฆษณาหรือประกาศแก่บุคคลทั่วไป]]ให้กระทำความผิด และความผิดนั้นมีกำหนดโทษ[[ไม่ต่ำกว่าหกเดือน]] ผู้นั้นต้องระวางโทษ[[กึ่งหนึ่งของโทษ]]ที่กำหนดไว้สำหรับความผิดนั้น","ถ้าได้มีการกระทำความผิดเพราะเหตุที่ได้มีการโฆษณาหรือประกาศตามความในวรรคแรก ผู้โฆษณาหรือประกาศต้องรับโทษ[[เสมือนเป็นตัวการ]]"]},{"n":"86","t":"ผู้สนับสนุน","u":"หน่วย ๕","p":["ผู้ใดกระทำด้วยประการใด ๆ อันเป็นการ[[ช่วยเหลือ หรือให้ความสะดวก]]ในการที่ผู้อื่นกระทำความผิด [[ก่อนหรือขณะกระทำความผิด]] [[แม้ผู้กระทำความผิดจะมิได้รู้ถึงการช่วยเหลือหรือให้ความสะดวกนั้นก็ตาม]] ผู้นั้นเป็น[[ผู้สนับสนุนการกระทำความผิด]] ต้องระวางโทษ[[สองในสามส่วน]]ของโทษที่กำหนดไว้สำหรับความผิดที่สนับสนุนนั้น"]},{"n":"87","t":"เกินขอบเขต","u":"หน่วย ๕","p":["ในกรณีที่มีการกระทำความผิดเพราะมีผู้ใช้ให้กระทำตามมาตรา ๘๔ เพราะมีผู้โฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิดตามมาตรา ๘๕ หรือโดยมีผู้สนับสนุนตามมาตรา ๘๖ ถ้าความผิดที่เกิดขึ้นนั้น ผู้กระทำได้กระทำไป[[เกินขอบเขตที่ใช้หรือที่โฆษณาหรือประกาศ]] หรือ[[เกินไปจากเจตนาของผู้สนับสนุน]] ผู้ใช้ให้กระทำความผิด ผู้โฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิด หรือผู้สนับสนุนการกระทำความผิด แล้วแต่กรณี ต้องรับผิดทางอาญา[[เพียงสำหรับความผิดเท่าที่อยู่ในขอบเขตที่ใช้]] หรือที่โฆษณาหรือประกาศ หรืออยู่ในขอบเขตแห่งเจตนาของผู้สนับสนุนการกระทำความผิดเท่านั้น [[แต่ถ้าโดยพฤติการณ์อาจเล็งเห็นได้]]ว่า อาจเกิดการกระทำความผิดเช่นที่เกิดขึ้นนั้นได้จากการใช้ การโฆษณา หรือประกาศ หรือการสนับสนุน ผู้ใช้ให้กระทำความผิด ผู้โฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิด หรือผู้สนับสนุนการกระทำความผิด แล้วแต่กรณี ต้องรับผิดทางอาญาตามความผิดที่เกิดขึ้นนั้น","ในกรณีที่ผู้ถูกใช้ ผู้กระทำตามคำโฆษณา หรือประกาศแก่บุคคลทั่วไปให้กระทำความผิด หรือตัวการในความผิด จะต้องรับผิดทางอาญามี[[กำหนดโทษสูงขึ้น]]เพราะอาศัยผลที่เกิดจากการกระทำความผิด ผู้ใช้ให้กระทำความผิด ผู้โฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิด หรือผู้สนับสนุนการกระทำความผิด แล้วแต่กรณี ต้องรับผิดทางอาญาตามความผิดที่มี[[กำหนดโทษสูงขึ้น]]นั้นด้วย แต่ถ้าโดยลักษณะของความผิด ผู้กระทำจะต้องรับผิดทางอาญามี[[กำหนดโทษสูงขึ้น]]เฉพาะเมื่อ[[ผู้กระทำต้องรู้ หรืออาจเล็งเห็นได้]]ว่าจะเกิดผลเช่นนั้นขึ้น ผู้ใช้ให้กระทำความผิด ผู้โฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิด หรือผู้สนับสนุนการกระทำความผิด จะต้องรับผิดทางอาญาตามความผิดที่มี[[กำหนดโทษสูงขึ้น]]ก็เฉพาะเมื่อตนได้รู้ หรืออาจเล็งเห็นได้ว่าจะเกิดผลเช่นที่เกิดขึ้นนั้น"]}];
const EX={"59":{"i":[["วรรคหนึ่ง: หลักความรับผิดทางอาญา","ต้องรับผิดก็ต่อเมื่อกระทำโดยเจตนา เป็นหลักทั่วไป ยกเว้น 2 กรณี คือ (1) กฎหมายบัญญัติให้รับผิดเมื่อกระทำโดยประมาท (2) กฎหมายบัญญัติไว้โดยแจ้งชัดให้รับผิดแม้ไม่มีเจตนา","นาย ก. ใช้มีดแทงนาย ข. ตายโดยตั้งใจ = เจตนา / นาย ค. ขับรถชนคนตายโดยไม่ระวัง = ประมาท ซึ่งกฎหมายบัญญัติเป็นความผิดไว้"],["วรรคสอง: เจตนา","ต้องครบ 2 ส่วน: (1) รู้สำนึกในการที่กระทำ (2) ประสงค์ต่อผล หรือเล็งเห็นผล ประสงค์ต่อผล = ต้องการให้เกิดผลนั้น เล็งเห็นผล = รู้ว่าผลย่อมเกิดแน่นอนหรือคาดหมายได้ว่าเกิดขึ้น แม้ไม่ได้อยากให้เกิดโดยตรง","นาย ก. ต้องการฆ่านาย ข. จึงยิง = ประสงค์ต่อผล / นาย ก. วางระเบิดเพื่อฆ่านาย ข. รู้ว่าคนขับรถข้าง ๆ ย่อมตายด้วย = เล็งเห็นผลต่อคนขับรถ"],["วรรคสาม: ไม่รู้ข้อเท็จจริงที่เป็นองค์ประกอบความผิด","ถ้าไม่รู้ข้อเท็จจริงที่เป็นองค์ประกอบความผิด จะถือว่าประสงค์หรือเล็งเห็นผลไม่ได้ จึงไม่มีเจตนา","นาย ก. หยิบร่มของนาย ข. กลับบ้านเพราะคิดว่าเป็นร่มของตน = ไม่รู้ว่าเป็นทรัพย์ของผู้อื่น จึงไม่มีเจตนาลักทรัพย์"],["วรรคสี่: ประมาท","ไม่ใช่เจตนา แต่ปราศจากความระมัดระวังที่บุคคลในภาวะเช่นนั้นต้องมีตามวิสัยและพฤติการณ์ และผู้กระทำอาจใช้ความระมัดระวังนั้นได้แต่ไม่ได้ใช้ให้เพียงพอ ต้องครบทุกองค์ประกอบ ถ้าสุดวิสัยที่จะระวังได้ก็ไม่ประมาท","คนขับรถใช้ความเร็วสูงในซอยแคบ เด็กวิ่งออกมาชนตาย = ประมาท"],["วรรคห้า: การกระทำรวมถึงการงดเว้น","การงดเว้นการที่จักต้องกระทำเพื่อป้องกันผล ถือเป็นการกระทำด้วย ผู้ที่มีหน้าที่ต้องป้องกันผลแล้วไม่ทำ จึงต้องรับผิดเสมือนกระทำเอง","แม่เห็นลูกทารกจะจมน้ำ ไม่ช่วยเพราะอยากให้ตาย = งดเว้น ถือเป็นการกระทำโดยเจตนาฆ่า"]],"tbl":null,"tip":null},"60":{"i":[["หลักกฎหมาย","เจตนาทำต่อคนหนึ่ง แต่ผลเกิดแก่อีกคนโดยพลาด ให้ถือว่ากระทำโดยเจตนาต่อคนที่ได้รับผลร้าย แต่เหตุเพิ่มโทษเพราะฐานะบุคคลหรือความสัมพันธ์ ห้ามนำมาเพิ่มโทษ","นาย ก. เล็งปืนยิงนาย ข. แต่กระสุนพลาดไปถูกนาย ค. ตาย = ผิดฐานฆ่านาย ค. โดยเจตนา / นาย ก. เล็งยิงบิดาตน กระสุนพลาดถูกคนแปลกหน้าตาย = ไม่เพิ่มโทษเพราะเป็นผู้บุพการี เพราะคนที่ตายไม่ใช่บิดา"]],"tbl":null,"tip":"พลาด = ตัวผู้ถูกกระทำเปลี่ยนไปเพราะกระทำพลาด (ต่างจาก ม.61 ที่เข้าใจผิดว่าคนนั้นคือเป้าหมาย)"},"61":{"i":[["หลักกฎหมาย","เจตนาทำต่อคนหนึ่ง แต่ทำต่ออีกคนเพราะสำคัญผิดว่าเป็นคนที่ต้องการ จะอ้างความสำคัญผิดว่าไม่มีเจตนาไม่ได้","นาย ก. จะฆ่านาย ข. เห็นคนในที่มืดคิดว่าเป็นนาย ข. จึงยิง แต่คือนาย ค. = ผิดฐานฆ่านาย ค. โดยเจตนา"]],"tbl":null,"tip":"ต่างจากม.60: ม.60 ยิงถูกคนอื่นเพราะพลาด ม.61 ยิงตรงตัวคนที่ยิงแต่คิดผิดว่าเป็นอีกคน"},"62":{"i":[["วรรคแรก: เข้าใจผิดว่ามีเหตุยกเว้นความผิด ยกเว้นโทษ หรือลดโทษ","ถ้าผู้กระทำเข้าใจผิดว่ามีข้อเท็จจริงที่ถ้ามีอยู่จริงจะทำให้ไม่เป็นความผิด ไม่ต้องรับโทษ หรือรับโทษน้อยลง ผู้กระทำย่อมได้รับประโยชน์นั้นเสมือนว่าข้อเท็จจริงนั้นมีอยู่จริง","ยกเว้นความผิด: นาย ก. เห็นนาย ข. ล้วงวัตถุสีดำคล้ายปืนจากกระเป๋า เข้าใจว่าจะถูกยิงจึงชิงยิงป้องกันตัว ความจริงเป็นกระเป๋าสตางค์ = ไม่มีความผิดเพราะป้องกันโดยชอบตามความเข้าใจผิด\nยกเว้นโทษ: นาย ก. เห็นนาย ข. ถูกโจรปล้น เข้าใจผิดว่าเป็นบิดาตน จึงช่วยทำร้ายโจรเกินกว่าเหตุ = ได้รับยกเว้นโทษฐานป้องกันเกินสมควรตามความเข้าใจผิด\nลดโทษ: นาย ก. เข้าใจผิดว่าภรรยากำลังร่วมประเวณีกับชายชู้ จึงบันดาลโทสะฆ่าทั้งสองตาย ความจริงเป็นหญิงอื่นที่คล้ายภรรยา = ยังผิดฐานฆ่า แต่ได้รับประโยชน์เรื่องบันดาลโทสะ ศาลลงโทษน้อยลงได้"],["วรรคสอง: เข้าใจผิดโดยประมาท","ถ้าความไม่รู้ (ม.59 วรรคสาม) หรือความเข้าใจผิดตามวรรคแรกเกิดจากความประมาทของผู้กระทำ และกฎหมายบัญญัติให้การกระทำนั้นเป็นความผิดฐานประมาทได้ ผู้กระทำต้องรับผิดฐานประมาท","นาย ก. ล่าสัตว์ เห็นพุ่มไม้ไหวจึงยิงทันทีโดยไม่ตรวจดู เข้าใจว่าเป็นหมูป่า ความจริงเป็นคนเก็บเห็ด = ไม่มีเจตนาฆ่าคน แต่ผิดฐานกระทำโดยประมาทเป็นเหตุให้ผู้อื่นตาย"],["วรรคสาม: เหตุเพิ่มโทษ ผู้กระทำต้องรู้","จะรับโทษหนักขึ้นโดยอาศัยข้อเท็จจริงใด ผู้กระทำต้องรู้ข้อเท็จจริงนั้น ถ้าไม่รู้จะเพิ่มโทษไม่ได้","นาย ก. ชกต่อยกับนาย ข. โดยไม่รู้ว่าเป็นตำรวจนอกเครื่องแบบที่กำลังปฏิบัติหน้าที่ = ผิดเพียงฐานทำร้ายร่างกายธรรมดา ไม่เพิ่มโทษฐานทำร้ายเจ้าพนักงาน"]],"tbl":[["วรรค","สถานการณ์","ผลทางกฎหมาย"],["1 สำคัญผิดที่เป็นคุณ","คิดว่าคนร้ายชักปืน จึงยิงสวน (ความจริงคือมือถือ)","ได้ประโยชน์ตามที่เข้าใจผิด (อ้างป้องกันได้)"],["2 สำคัญผิดโดยประมาท","คิดว่าพุ่มไม้ไหวคือหมูป่า จึงยิง (ความจริงคือคน)","พ้นผิดฐานเจตนา แต่ผิดฐานประมาทแทน"],["3 ไม่รู้เหตุเพิ่มโทษ","ทำร้ายคนโดยไม่รู้ว่าเป็นตำรวจนอกเครื่องแบบ","รับโทษฐานทำร้ายธรรมดา ไม่เพิ่มโทษ"]],"tip":null},"63":{"i":[["หลักกฎหมาย","ถ้าผลของการกระทำทำให้ต้องรับโทษหนักขึ้น (เช่น ผลคือตาย ซึ่งเพิ่มโทษ) ผลนั้นต้องเป็นผลที่ตามธรรมดาย่อมเกิดขึ้นได้จากการกระทำนั้น ถ้าผลเกิดเพราะเหตุผิดธรรมดา ก็ไม่นำผลนั้นมาเพิ่มโทษ","นาย ก. ตบหน้านาย ข. ล้มกระแทกพื้นหัวแตกตาย = ตามธรรมดาอาจเกิดได้ จึงเพิ่มโทษตามผล / นาย ก. ตบหน้าเบา ๆ ปรากฏว่านาย ข. แพ้ยาแล้วมีโรคร้ายแรงที่ไม่มีใครรู้ ตกใจแล้วตาย = ไม่ใช่ผลธรรมดา ไม่เพิ่มโทษตามผลตาย"]],"tbl":null,"tip":null},"64":{"i":[["วรรคแรก: หลักทั่วไป","ไม่รู้กฎหมายไม่เป็นข้อแก้ตัวให้พ้นผิด","นาย ก. อ้างว่าไม่รู้ว่าการครอบครองของกลางเป็นความผิด = ยังต้องรับผิด"],["ข้อยกเว้น","ถ้าศาลเห็นว่าตามสภาพและพฤติการณ์ ผู้กระทำอาจไม่รู้ว่ากฎหมายบัญญัติเป็นความผิด ศาลอนุญาตให้นำพยานหลักฐานได้ ถ้าศาลเชื่อว่าไม่รู้จริง ศาลลงโทษน้อยกว่าที่กฎหมายกำหนดเพียงใดก็ได้ (ลดโทษ ไม่ใช่ยกเว้นโทษ)","คนต่างถิ่นที่เพิ่งเข้ามา ไม่รู้ข้อห้ามเฉพาะท้องที่ = ศาลอาจลงโทษน้อยลง"]],"tbl":null,"tip":null},"65":{"i":[["วรรคหนึ่ง: ไม่ต้องรับโทษ","ขณะกระทำความผิด ไม่สามารถรู้ผิดชอบ หรือไม่สามารถบังคับตนเองได้ เพราะมีจิตบกพร่อง โรคจิต หรือจิตฟั่นเฟือน ผู้นั้นไม่ต้องรับโทษ (ยกเว้นโทษ ไม่ใช่ไม่ผิด) ต้องพิจารณาในขณะกระทำความผิด","นาย ก. ป่วยจิตเภทระยะรุนแรง เห็นภาพหลอนว่านาย ข. เป็นปีศาจ จึงฆ่านาย ข. = ไม่ต้องรับโทษ"],["วรรคสอง: ลดโทษ","ถ้ายังรู้ผิดชอบอยู่บ้าง หรือยังบังคับตนเองได้บ้าง ต้องรับโทษ แต่ศาลลงโทษน้อยกว่าที่กฎหมายกำหนดเพียงใดก็ได้","นาย ก. มีอาการทางจิตเล็กน้อย ยังรู้ว่าการทำร้ายผู้อื่นผิด แต่ควบคุมตนเองไม่ค่อยได้ = ศาลลดโทษได้"]],"tbl":null,"tip":null},"66":{"i":[["วรรคแรก: หลักและข้อยกเว้น","ความมึนเมาจากสุราหรือสิ่งเมา อ้างตาม ม.65 ไม่ได้ เว้นแต่ (1) ไม่รู้ว่าสิ่งนั้นทำให้มึนเมา หรือ (2) ถูกขืนใจให้เสพ และขณะกระทำความผิดไม่สามารถรู้ผิดชอบหรือบังคับตนเองได้ จึงได้รับยกเว้นโทษ","นาย ก. ดื่มน้ำผลไม้ที่ถูกผสมสุราโดยไม่รู้ จนเมาแล้วทำร้ายผู้อื่นโดยไม่รู้ผิดชอบ = ยกเว้นโทษ / นาย ก. ดื่มเหล้าเองจนเมาแล้วทำร้ายผู้อื่น = อ้างไม่ได้"],["วรรคสอง: ลดโทษ","ถ้ายังรู้ผิดชอบหรือบังคับตนเองได้บ้าง (ในกรณีที่เข้าข้อยกเว้นวรรคแรก) ศาลลงโทษน้อยกว่าที่กำหนดเพียงใดก็ได้","ถูกมอมเหล้าจนมึนเมา แต่ยังรู้ตัวอยู่บ้าง = ศาลลดโทษได้"]],"tbl":null,"tip":null},"67":{"i":[["จำเป็น 2 กรณี","(1) อยู่ในที่บังคับหรือภายใต้อำนาจที่ไม่อาจหลีกเลี่ยงหรือขัดขืนได้ (2) เพื่อให้ตนเองหรือผู้อื่นพ้นภยันตรายที่ใกล้จะถึง ไม่อาจหลีกเลี่ยงโดยวิธีอื่นได้ และภยันตรายนั้นตนมิได้ก่อขึ้นเพราะความผิดของตน ต้องไม่เกินสมควรแก่เหตุ จึงไม่ต้องรับโทษ (ยกเว้นโทษ)","(1) โจรเอาปืนจ่อหัวนาย ก. บังคับให้ขโมยของ นาย ก. จึงทำตาม (2) เรือกำลังจม นาย ก. ผลักผู้อื่นลงน้ำเพื่อให้ตนรอด ไม่มีวิธีอื่น ถ้าเกินสมควรให้ดู ม.69"]],"tbl":null,"tip":"ต่างจากม.68: ม.67 หนีภยันตรายโดยไปกระทำต่อบุคคลที่สาม ไม่จำเป็นต้องมีการประทุษร้ายผิดกฎหมาย / ม.68 ต้องมีการประทุษร้ายอันละเมิดกฎหมายและตอบโต้ผู้ประทุษร้าย"},"68":{"i":[["หลักกฎหมาย (องค์ประกอบ)","(1) มีภยันตรายจากการประทุษร้ายอันละเมิดต่อกฎหมาย (2) ภยันตรายใกล้จะถึง (3) ป้องกันสิทธิของตนหรือผู้อื่น (4) ทำพอสมควรแก่เหตุ ถ้าครบ การกระทำเป็นการป้องกันโดยชอบด้วยกฎหมาย ผู้กระทำไม่มีความผิด (ยกเว้นความผิด)","นาย ก. ถูกนาย ข. ใช้มีดจะแทง จึงใช้ไม้ตีแขนนาย ข. เพื่อให้ปล่อยมีด = พอสมควรแก่เหตุ ไม่ผิด / ภยันตรายผ่านไปแล้ว (ผู้ประทุษร้ายวางมีดแล้ว) แต่ยังตามไปทำร้าย = ไม่ใช่ป้องกัน"]],"tbl":null,"tip":null},"69":{"i":[["หลักกฎหมาย","ถ้าเป็นกรณีตาม ม.67 หรือ ม.68 แต่ผู้กระทำทำเกินสมควรแก่เหตุ เกินกว่ากรณีจำเป็น หรือเกินกว่ากรณีที่จำต้องป้องกัน ศาลลงโทษน้อยกว่าที่กำหนดเพียงใดก็ได้ แต่ถ้าเกิดจากความตื่นเต้น ตกใจ หรือกลัว ศาลจะไม่ลงโทษก็ได้","นาย ก. ถูกนาย ข. ชกหน้า (ภยันตรายเล็กน้อย) แล้วชักมีดแทงนาย ข. ตาย = เกินสมควร ศาลลดโทษได้ / ถ้ากระทำเพราะตกใจกลัวจนไม่ทันยั้งคิด ศาลไม่ลงโทษก็ได้"]],"tbl":null,"tip":"เกินสมควร ต้องมีมูลเหตุของ ม.67 หรือ ม.68 ก่อน ถ้ามีเหตุตามนั้นแต่ทำเกินไป จึงใช้ ม.69"},"70":{"i":[["หลักกฎหมาย","กระทำตามคำสั่งของเจ้าพนักงาน แม้คำสั่งนั้นไม่ชอบด้วยกฎหมาย ถ้าผู้กระทำมีหน้าที่หรือเชื่อโดยสุจริตว่ามีหน้าที่ต้องปฏิบัติตาม ผู้นั้นไม่ต้องรับโทษ เว้นแต่รู้ว่าคำสั่งนั้นไม่ชอบด้วยกฎหมาย (ยกเว้นโทษ)","ผู้บังคับบัญชาสั่งทหารเวรให้ยึดสิ่งของจากราษฎรโดยไม่มีอำนาจ ทหารเวรเชื่อโดยสุจริตว่าต้องทำตาม = ไม่ต้องรับโทษ / ถ้ารู้อยู่ว่าคำสั่งนั้นผิดกฎหมายแต่ยังทำ = ต้องรับโทษ"]],"tbl":null,"tip":null},"71":{"i":[["วรรคหนึ่ง: สามีภริยา","ความผิดต่อทรัพย์ตามที่ระบุไว้ในมาตรานี้ ถ้าสามีกระทำต่อภริยา หรือภริยากระทำต่อสามี ผู้กระทำไม่ต้องรับโทษ (ยกเว้นโทษ)","ภริยาลักทรัพย์ของสามี = ไม่ต้องรับโทษ"],["วรรคสอง: ญาติสนิท","ถ้าผู้บุพการีกระทำต่อผู้สืบสันดาน ผู้สืบสันดานกระทำต่อผู้บุพการี หรือพี่น้องร่วมบิดามารดาเดียวกันกระทำต่อกัน ความผิดนั้นเป็นความผิดอันยอมความได้ และศาลลงโทษน้อยกว่าที่กำหนดเพียงใดก็ได้","ลูกลักทรัพย์ของแม่ = ยอมความได้ และศาลลดโทษได้"]],"tbl":null,"tip":"จำให้แม่น: สามีภริยา = ไม่ต้องรับโทษ / ญาติสายตรงและพี่น้องร่วมบิดามารดา = ยอมความได้ + ลดโทษได้"},"72":{"i":[["องค์ประกอบ","(1) ถูกข่มเหงอย่างร้ายแรง (2) ด้วยเหตุอันไม่เป็นธรรม (3) บันดาลโทสะ คือโกรธจัดจนขาดสติยับยั้ง (4) กระทำความผิดต่อผู้ข่มเหง (5) ในขณะนั้น คือติดต่อเนื่องกับการข่มเหง ผลคือศาลลงโทษน้อยกว่าที่กำหนดเพียงใดก็ได้ (ลดโทษ ไม่ใช่ยกเว้น)","นาย ก. ถูกนาย ข. ด่าพ่อแม่อย่างหยาบคายต่อหน้าผู้คนโดยไม่มีเหตุ นาย ก. โกรธจัดจึงชกนาย ข. ทันที = ศาลลดโทษได้ / ถ้ากลับไปตั้งใจคิดวางแผนแล้วค่อยมาแก้แค้นวันรุ่งขึ้น = ไม่ใช่บันดาลโทสะ"]],"tbl":null,"tip":"ถ้าภยันตรายผ่านไปแล้ว แต่ผู้กระทำยังโกรธอยู่และลงมือทันที ยังอาจเข้าม.72 ได้ ต่างจากป้องกัน (ม.68) ที่ต้องมีภยันตรายใกล้จะถึง"},"73":{"i":[["วรรคหนึ่ง","เด็กอายุไม่เกิน 12 ปี กระทำการอันกฎหมายบัญญัติเป็นความผิด ไม่ต้องรับโทษ","เด็กชายอายุ 11 ปี ขโมยของ = ไม่ต้องรับโทษ"],["วรรคสอง","พนักงานสอบสวนส่งตัวเด็กให้พนักงานเจ้าหน้าที่ตามกฎหมายคุ้มครองเด็ก เพื่อดำเนินการคุ้มครองสวัสดิภาพ",""]],"tbl":null,"tip":null},"74":{"i":[["วรรคหนึ่ง: เด็กกว่า 12 ปี ไม่เกิน 15 ปี","ไม่ต้องรับโทษ แต่ศาลมีอำนาจดำเนินการ (๑) ว่ากล่าวตักเตือนแล้วปล่อยตัวไป (๒) มอบตัวให้บิดามารดาหรือผู้ปกครองโดยวางข้อกำหนดให้ระวังไม่ให้ก่อเหตุร้าย และกำหนดจำนวนเงินไม่เกินที่ศาลกำหนด (๓) มอบตัวให้บุคคลหรือองค์การที่ศาลเห็นสมควรดูแลอบรม","เด็กหญิงอายุ 14 ปี ทำร้ายผู้อื่น = ไม่ต้องรับโทษ ศาลตักเตือนแล้วปล่อย หรือให้พ่อแม่ทำทัณฑ์บน"],["วรรคสอง","ศาลอาจกำหนดเงื่อนไขคุมความประพฤติเด็กตาม ม.56 และตั้งพนักงานคุมประพฤติ",""],["วรรคสาม","ถ้าเด็กไม่มีผู้ปกครอง หรือผู้ปกครองดูแลไม่ได้ ศาลมอบให้บุคคลหรือองค์การที่ยินยอมดูแลอบรมตามระยะเวลาที่กำหนด",""],["วรรคสี่","ศาลเปลี่ยนแปลงแก้ไขคำสั่งตาม (๒) (๓) วรรคสองและวรรคสามได้ ถ้าพฤติการณ์เปลี่ยนไป",""]],"tbl":null,"tip":null},"75":{"i":[["หลักกฎหมาย","เด็กกว่า 15 ปี แต่ต่ำกว่า 18 ปี ศาลพิจารณาความรู้ผิดชอบและสิ่งอื่นทั้งปวง ถ้าไม่สมควรลงโทษ ให้จัดการตาม ม.74 ถ้าสมควรลงโทษ ให้ลดมาตราส่วนโทษลงกึ่งหนึ่ง (ลดแน่นอน ไม่ใช่ลดเพียงใดก็ได้)","เด็กอายุ 17 ปี ลักทรัพย์ ศาลเห็นว่ารู้ผิดชอบดี ลงโทษ = ต้องลดกึ่งหนึ่ง / ศาลเห็นว่าไม่สมควรลงโทษ = จัดการตามวิธีใน ม.74"]],"tbl":null,"tip":"จำเลขอายุ: ≤12 ไม่รับโทษ, 12-15 ไม่รับโทษแต่ศาลดำเนินการ, 15-18 ลดกึ่งหนึ่งหรือใช้ ม.74, 18-20 ลด 1/3 หรือ 1/2"},"76":{"i":[["หลักกฎหมาย","อายุตั้งแต่ 18 ปี แต่ยังไม่เกิน 20 ปี ศาลเห็นสมควรจะลดมาตราส่วนโทษลงหนึ่งในสามหรือกึ่งหนึ่งก็ได้ (เป็นดุลพินิจของศาล จะไม่ลดก็ได้)","นาย ก. อายุ 19 ปี ชิงทรัพย์ ศาลเห็นสมควรลดโทษ = ลด 1/3 หรือ 1/2 ได้"]],"tbl":null,"tip":null},"77":{"i":[["วรรคหนึ่ง","ถ้าศาลวางข้อกำหนดให้บิดามารดา ผู้ปกครอง หรือผู้ที่เด็กอาศัยอยู่ ระวังเด็กไม่ให้ก่อเหตุร้ายตาม ม.74 (๒) แล้วเด็กก่อเหตุร้ายภายในเวลาที่กำหนด ศาลบังคับให้ชำระเงินไม่เกินจำนวนในข้อกำหนดได้ ถ้าไม่ชำระ ศาลสั่งยึดทรัพย์ได้",""],["วรรคสอง","เมื่อศาลบังคับชำระเงินแล้ว ถ้าไม่เปลี่ยนแปลงคำสั่งตาม ม.74 วรรคท้าย ข้อกำหนดนั้นยังใช้บังคับต่อไปจนสิ้นเวลาที่กำหนด",""]],"tbl":null,"tip":null},"78":{"i":[["วรรคหนึ่ง","เมื่อมีเหตุบรรเทาโทษ ไม่ว่าจะเพิ่มหรือลดโทษตามกฎหมายแล้วหรือไม่ ศาลลดโทษไม่เกินกึ่งหนึ่งของโทษที่จะลงแก่ผู้กระทำความผิดได้",""],["วรรคสอง: เหตุบรรเทาโทษ","โฉดเขลาเบาปัญญา ตกอยู่ในความทุกข์สาหัส มีคุณความดีมาก่อน รู้สึกผิดและพยายามบรรเทาผลร้าย ลุแก่โทษต่อเจ้าพนักงาน หรือให้ความรู้แก่ศาลอันเป็นประโยชน์ หรือเหตุอื่นทำนองเดียวกัน","จำเลยสำนึกผิด ชดใช้ค่าเสียหายแก่ผู้เสียหาย และรับสารภาพ = ศาลลดโทษไม่เกินกึ่งหนึ่งได้"]],"tbl":null,"tip":null},"79":{"i":[["หลักกฎหมาย","คดีที่มีโทษปรับสถานเดียว ถ้าผู้ต้องหานำค่าปรับอัตราอย่างสูงมาชำระก่อนที่ศาลเริ่มสืบพยาน คดีระงับไป","นาย ก. ถูกกล่าวหาความผิดที่มีโทษปรับอย่างเดียว นำค่าปรับอัตราสูงสุดมาชำระก่อนศาลเริ่มสืบพยาน = คดีระงับ"]],"tbl":null,"tip":null},"80":{"i":[["วรรคหนึ่ง: พยายาม","ลงมือกระทำความผิดแต่กระทำไปไม่ตลอด (พยายามไม่ตลอด) หรือกระทำไปตลอดแล้วแต่ไม่บรรลุผล (พยายามตลอดแล้ว) ผู้นั้นพยายามกระทำความผิด","นาย ก. เงื้อมีดจะแทงนาย ข. ถูกคนห้ามไว้ = ไม่ตลอด / นาย ก. ยิงนาย ข. แต่กระสุนพลาด = ตลอดแต่ไม่บรรลุผล"],["วรรคสอง: โทษ","ระวางโทษสองในสามส่วนของโทษที่กฎหมายกำหนดไว้สำหรับความผิดนั้น","เตรียมการ (ยังไม่ลงมือ) ไม่ใช่พยายาม"]],"tbl":null,"tip":null},"81":{"i":[["วรรคแรก: พยายามที่ไม่อาจบรรลุผลได้แน่แท้","กระทำโดยมุ่งต่อผลซึ่งกฎหมายบัญญัติเป็นความผิด แต่ไม่อาจบรรลุผลได้อย่างแน่แท้ เพราะเหตุปัจจัยที่ใช้ หรือเหตุแห่งวัตถุที่มุ่งหมายกระทำต่อ ถือว่าพยายาม แต่ลงโทษไม่เกินกึ่งหนึ่ง","นาย ก. ใช้ปืนที่ไม่มีกระสุนยิงนาย ข. = เหตุปัจจัยที่ใช้ / นาย ก. แทงคนที่ตายแล้ว เข้าใจว่ายังมีชีวิต = เหตุแห่งวัตถุ"],["วรรคสอง: งมงาย","ถ้ากระทำไปโดยความเชื่ออย่างงมงาย ศาลจะไม่ลงโทษก็ได้","นาย ก. เสกคาถาเป่าตุ๊กตาเพื่อให้นาย ข. ตาย = ศาลไม่ลงโทษได้"]],"tbl":null,"tip":null},"82":{"i":[["หลักกฎหมาย","ผู้พยายามกระทำความผิดที่ยับยั้งเสียเองไม่กระทำให้ตลอด หรือกลับใจแก้ไขไม่ให้การกระทำบรรลุผล ไม่ต้องรับโทษสำหรับการพยายามนั้น แต่ถ้าการที่ได้กระทำไปแล้วเป็นความผิดตามกฎหมายอื่น ต้องรับโทษสำหรับความผิดนั้น","นาย ก. ใช้มีดจะแทงนาย ข. แต่เปลี่ยนใจเองวางมีด = ไม่ต้องรับโทษฐานพยายามฆ่า / แต่ถ้าได้ทำให้นาย ข. บาดเจ็บไปแล้ว ต้องรับโทษฐานทำร้ายร่างกาย"]],"tbl":null,"tip":"ต้องสมัครใจเอง ถ้าถูกขัดขวาง (เช่น มีคนมาห้ามจนหยุด) ไม่ใช่ยับยั้งเอง"},"83":{"i":[["หลักกฎหมาย","ความผิดเกิดจากการกระทำของคนตั้งแต่สองคนขึ้นไป ผู้ร่วมกระทำความผิดด้วยกันเป็นตัวการ ต้องรับโทษตามที่กฎหมายกำหนดสำหรับความผิดนั้น (องค์ประกอบ: ร่วมกระทำ มีเจตนาร่วมกัน)","นาย ก. และนาย ข. ตกลงกันไปปล้นร้านทอง นาย ก. ใช้ปืนขู่ นาย ข. เก็บทอง = ทั้งคู่เป็นตัวการ รับโทษเต็ม"]],"tbl":null,"tip":null},"84":{"i":[["วรรคแรก: ผู้ใช้","ก่อให้ผู้อื่นกระทำความผิด ไม่ว่าด้วยการใช้ บังคับ ขู่เข็ญ จ้าง วาน ยุยงส่งเสริม หรือวิธีอื่นใด เป็นผู้ใช้ให้กระทำความผิด","นาย ก. จ้างนาย ข. ไปทำร้ายนาย ค. = นาย ก. เป็นผู้ใช้"],["วรรคสอง: ความผิดไม่ได้กระทำ","ถ้าความผิดมิได้กระทำลง (เช่น ผู้ถูกใช้ไม่ยอมทำ ยังไม่ได้ทำ) ผู้ใช้รับโทษหนึ่งในสาม",""],["วรรคสาม: ผู้ถูกใช้ทำความผิด","ผู้ใช้รับโทษเสมือนตัวการ และถ้าผู้ถูกใช้เป็นเด็กอายุไม่เกิน 18 ปี ผู้พิการ ผู้ทุพพลภาพ ลูกจ้างหรือผู้ใต้บังคับบัญชา คนยากจน หรือผู้ต้องพึ่งพาผู้ใช้ ให้เพิ่มโทษผู้ใช้กึ่งหนึ่ง","นาย ก. ใช้ลูกน้องซึ่งเป็นลูกจ้างไปลักทรัพย์ และลูกน้องทำจริง = นาย ก. รับโทษเสมือนตัวการ และเพิ่มโทษกึ่งหนึ่ง"]],"tbl":null,"tip":"ลำดับวรรคของมาตรานี้ในแอปยังไม่ได้ตรวจยืนยันกับต้นฉบับ"},"85":{"i":[["วรรคหนึ่ง","โฆษณาหรือประกาศแก่บุคคลทั่วไปให้กระทำความผิด และความผิดนั้นมีกำหนดโทษไม่ต่ำกว่าหกเดือน ผู้นั้นรับโทษกึ่งหนึ่งของโทษสำหรับความผิดนั้น","นาย ก. โพสต์ในที่สาธารณะเรียกชวนคนทั่วไปไปเผาสถานที่ราชการ = รับโทษกึ่งหนึ่งแม้ยังไม่มีใครทำ"],["วรรคสอง","ถ้ามีการกระทำความผิดเพราะการโฆษณาหรือประกาศนั้น ผู้โฆษณาต้องรับโทษเสมือนตัวการ",""]],"tbl":null,"tip":"ต่างจากผู้ใช้ (ม.84): ม.85 ประกาศแก่คนทั่วไป ไม่ได้เจาะจงตัวคน"},"86":{"i":[["หลักกฎหมาย","ช่วยเหลือหรือให้ความสะดวกแก่ผู้อื่นในการกระทำความผิด ก่อนหรือขณะกระทำ แม้ผู้กระทำความผิดจะไม่รู้ถึงการช่วยเหลือนั้น เป็นผู้สนับสนุน ต้องรับโทษสองในสามส่วนของโทษความผิดที่สนับสนุน","นาย ก. รู้ว่านาย ข. จะไปปล้น จึงให้ยืมรถไปใช้ = ผู้สนับสนุน / ช่วยเหลือหลังความผิดเสร็จแล้ว ไม่ใช่ผู้สนับสนุนตามมาตรานี้"]],"tbl":null,"tip":"ต่างจากตัวการ: ตัวการลงมือร่วมกัน ผู้สนับสนุนเพียงช่วยเหลือ ไม่ได้ร่วมลงมือ"},"87":{"i":[["วรรคแรก: เกินขอบเขต","ผู้ใช้ ผู้โฆษณา หรือผู้สนับสนุน รับผิดเพียงเท่าความผิดที่ใช้ ที่โฆษณา หรือที่สนับสนุน ถ้าผู้กระทำทำเกินขอบเขตหรือเกินเจตนาของผู้สนับสนุน แต่ถ้าผู้ใช้ ผู้โฆษณา หรือผู้สนับสนุนอาจเล็งเห็นได้ว่าอาจเกิดความผิดเช่นนั้นจากการใช้ การโฆษณา หรือการสนับสนุน ต้องรับผิดตามความผิดที่เกิดขึ้นนั้นด้วย","นาย ก. จ้างนาย ข. ไปทำร้ายนาย ค. แต่นาย ข. ไปลักทรัพย์ที่บ้านนาย ค. ด้วย ซึ่งนาย ก. ไม่อาจเล็งเห็นได้ = นาย ก. รับผิดเพียงฐานทำร้ายร่างกาย"],["วรรคสอง: ผลทำให้โทษสูงขึ้น","ถ้าผู้ถูกใช้ ผู้กระทำตามคำโฆษณา หรือตัวการ ต้องรับผิดโทษสูงขึ้นเพราะผลที่เกิดจากการกระทำ ผู้ใช้ ผู้โฆษณา หรือผู้สนับสนุน ต้องรับผิดตามความผิดที่มีโทษสูงขึ้นนั้นด้วย ก็เฉพาะเมื่อตนรู้ หรืออาจเล็งเห็นได้ว่าจะเกิดผลเช่นนั้น","นาย ก. จ้างนาย ข. ไปทำร้ายนาย ค. ผลคือนาย ค. ตาย ถ้านาย ก. อาจเล็งเห็นได้ว่าผลเช่นนั้นเกิดขึ้นได้ = รับผิดตามความผิดที่มีโทษสูงขึ้น / ถ้าไม่อาจเล็งเห็นได้ = ไม่รับผิดในผลนั้น"]],"tbl":null,"tip":null}};
const $=s=>document.querySelector(s);
let st={lv:{},sel:[],mode:'read',card:null,flip:false};
try{const x=JSON.parse(localStorage.getItem('po59-87')||'{}');if(x.lv)st.lv=x.lv}catch(e){}
function save(){try{localStorage.setItem('po59-87',JSON.stringify({lv:st.lv}))}catch(e){}}
const lv=n=>st.lv[n]||1;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function paras(s,blank){return s.p.map((p,i)=>{const lab=s.p.length==1?'วรรคเดียว':'วรรค'+['หนึ่ง','สอง','สาม','สี่','ห้า','หก'][i];
 const h=esc(p).replace(/\[\[(.*?)\]\]/g,(m,a)=>blank?`<span class="b" tabindex="0" role="button">${a}</span>`:`<span class="r">${a}</span>`).replace(/\n/g,'<br>');
 return `<p><span class="v">${lab}</span>${h}</p>`}).join('')}
function explain(n){const e=EX[n];if(!e)return '';
 let h=e.i.map(([a,b,c])=>`<h4>${esc(a)}</h4><p>${esc(b)}</p>`+(c?c.split('\n').map(x=>`<div class="eg">ตัวอย่าง: ${esc(x)}</div>`).join(''):'')).join('');
 if(e.tbl)h+=`<h4>ตารางสรุป</h4><div class="tw"><table>${e.tbl.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')}</table></div>`;
 if(e.tip)h+=`<div class="tip">${esc(e.tip)}</div>`;return h}
function scope(){return D.filter(s=>!st.sel.length||st.sel.includes(s.n))}
function renderChips(){$('#chips').innerHTML=D.map(s=>`<button class="chip l${lv(s.n)}" data-n="${s.n}" aria-pressed="${st.sel.includes(s.n)}">ม.${s.n}</button>`).join('')+`<button class="chip" data-n="all">ทั้งหมด</button>`}
function renderStats(){const k=[1,2,3].map(l=>D.filter(s=>lv(s.n)==l).length);
 $('#stats').innerHTML=`<span>ยังไม่จำ <b>${k[0]}</b></span><span>กำลังจำ <b>${k[1]}</b></span><span>จำได้แล้ว <b>${k[2]}</b></span><div class="meter"><i style="width:${(k[2]*100/D.length).toFixed(0)}%"></i></div>`}
const LV=['','ยังไม่จำ','กำลังจำ','จำได้แล้ว'];
function view(){renderStats();renderChips();const m=st.mode;
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.m==m));
 if(m=='read'){$('#main').innerHTML=scope().map(s=>`<div class="sec"><div class="sh"><b>ม.${s.n} ${s.t}</b><span>${s.u}</span><button class="xb" data-x="${s.n}" aria-expanded="false" style="margin-left:0">อธิบาย</button></div>${paras(s)}<div class="ex" id="ex${s.n}">${explain(s.n)}</div></div>`).join('')}
 else if(m=='cloze'){$('#main').innerHTML=`<p class="hint">แตะช่องว่างเพื่อดูคำตอบ แล้วประเมินตัวเอง เลือกมาตราด้านบนเพื่อจำกัดขอบเขต</p>`+scope().map(s=>`<div class="sec" data-n="${s.n}"><div class="sh"><b>ม.${s.n} ${s.t}</b><span class="lv l${lv(s.n)}">${LV[lv(s.n)]}</span></div>${paras(s,true)}<div class="act"><button class="btn" data-a="all">เปิดทั้งหมด</button><button class="btn w" data-a="2">ยังไม่แม่น</button><button class="btn g" data-a="3">จำได้</button></div></div>`).join('')}
 else if(m=='quiz')quiz();else card()}
function pick(){const pool=scope();if(!pool.length)return null;
 const w=pool.map(s=>[1,0.45,0.12][lv(s.n)-1]*(s.n==st.card?0.1:1));const t=w.reduce((a,b)=>a+b,0);let r=Math.random()*t;
 for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i].n}return pool[0].n}
function card(){if(!st.card||(st.sel.length&&!st.sel.includes(st.card)))st.card=pick();const s=D.find(x=>x.n==st.card);
 $('#main').innerHTML=`<div class="sec fc"><div class="pbar">${LV[lv(s.n)]} · ${s.u}</div><div class="q">มาตรา ${s.n}</div><p class="hint">${st.flip?'':'นึกให้ออกว่าเรื่องอะไร และคำสำคัญมีอะไรบ้าง แล้วกดดูคำตอบ'}</p>${st.flip?`<div class="sh"><b>${s.t}</b></div>`+paras(s):''}<div class="act">${st.flip?`<button class="btn w" data-c="1">ยังจำไม่ได้</button><button class="btn" data-c="2">เกือบได้</button><button class="btn g" data-c="3">จำได้</button>`:`<button class="btn p" data-c="show">ดูคำตอบ</button>`}</div></div>`}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const RX=/\[\[(.*?)\]\]/g;
function newQ(){const pool=scope();if(!pool.length)return null;
 const w=pool.map(s=>[1,0.5,0.2][lv(s.n)-1]);let r=Math.random()*w.reduce((a,b)=>a+b,0),s=pool[0];
 for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0){s=pool[i];break}}
 const qt=st.qt||'mix',rr=Math.random(),T=qt=='num'?3:qt=='fill'?1:(rr<.45?3:rr<.6?2:1);
 if(T==3){const pi=Math.floor(Math.random()*s.p.length),key=x=>[...x.matchAll(RX)].map(m=>m[1]).join(' · ');
  const a=key(s.p[pi]);const same=s.p.map(key).filter(x=>x!=a);
  const oth=[...new Set(D.filter(x=>x.n!=s.n).flatMap(x=>x.p.map(key)))].filter(x=>x!=a);
  const d=[...shuf(same).slice(0,1),...shuf(oth)].filter((x,i,ar)=>ar.indexOf(x)==i).slice(0,3);
  const opts=shuf([a,...d]);return {t:3,n:s.n,pi,opts,ans:opts.indexOf(a),picked:-1}}
 if(T==2){const opts=shuf([s,...shuf(D.filter(x=>x.n!=s.n)).slice(0,3)]);
  return {t:2,n:s.n,pi:0,opts:opts.map(o=>`ม.${o.n} ${o.t}`),ans:opts.indexOf(s),picked:-1}}
 const pi=Math.floor(Math.random()*s.p.length);const ph=[...s.p[pi].matchAll(RX)].map(m=>m[1]);
 const k=Math.floor(Math.random()*ph.length),a=ph[k];
 const all=[...new Set(D.flatMap(x=>x.p.flatMap(q=>[...q.matchAll(RX)].map(m=>m[1]))))].filter(x=>x!=a&&!ph.includes(x));
 const d=shuf(all).sort((x,y)=>Math.abs(x.length-a.length)-Math.abs(y.length-a.length)).slice(0,10);
 const opts=shuf([a,...shuf(d).slice(0,3)]);
 return {t:1,n:s.n,pi,k,opts,ans:opts.indexOf(a),picked:-1}}
function quiz(){if(!st.q||(st.sel.length&&!st.sel.includes(st.q.n)))st.q=newQ();const q=st.q;
 if(!q){$('#main').innerHTML='<p class="hint">เลือกมาตราก่อน</p>';return}
 const s=D.find(x=>x.n==q.n),done=q.picked>=0;let body;
 if(q.t==3){const vl=s.p.length==1?'วรรคเดียว':'วรรค'+['หนึ่ง','สอง','สาม','สี่','ห้า','หก'][q.pi];
  body=`<p class="q2">มาตรา ${s.n} ${vl} วางหลักไว้ว่าอย่างไร</p><p class="hint">เลือกกลุ่มคำสำคัญที่ตรงกับมาตรานี้</p>`+(done?`<div class="sec" style="margin:0 0 12px"><div class="sh"><b>ม.${s.n} ${s.t}</b></div>${paras({p:[s.p[q.pi]]})}</div>`:'')}
 else if(q.t==2){body=`<p class="q2">ข้อความนี้คือเรื่องอะไร</p>`+`<div class="sec" style="margin:0 0 12px">${paras({p:[s.p[0]]})}</div>`}
 else{let c=0;const txt=esc(s.p[q.pi]).replace(RX,(m,a)=>{const me=c++==q.k;
   if(!me)return `<span class="r">${a}</span>`;
   return done?`<span class="fill ${q.picked==q.ans?'ok':'no'}">${a}</span>`:`<span class="fill">&nbsp;&nbsp;&nbsp;&nbsp;</span>`}).replace(/\n/g,'<br>');
  body=`<p class="q2">เลือกคำที่เติมช่องว่างได้ถูกต้อง · ${s.p.length==1?'วรรคเดียว':'วรรค'+['หนึ่ง','สอง','สาม','สี่','ห้า','หก'][q.pi]} ของ ม.${s.n} ${s.t}</p><div class="sec" style="margin:0 0 12px"><p>${txt}</p></div>`}
 const sc=st.sc||(st.sc={r:0,w:0});
 const M=[['mix','ผสม'],['num','เลขมาตรา'],['fill','เติมคำ']];
 $('#main').innerHTML=`<div class="chips">${M.map(x=>`<button class="chip" data-qt="${x[0]}" aria-pressed="${(st.qt||'mix')==x[0]}">${x[1]}</button>`).join('')}</div><div class="pbar">ถูก <b>${sc.r}</b> · ผิด <b>${sc.w}</b></div>${body}`+q.opts.map((o,i)=>`<button class="opt${done?(i==q.ans?' ok':(i==q.picked?' no':'')):''}" data-o="${i}" ${done?'disabled':''}>${esc(o)}</button>`).join('')+(done?`<div class="act"><button class="btn p" data-q="next">ข้อถัดไป</button></div>`:'')}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.mode=b.dataset.m;st.flip=false;view()};
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;const n=b.dataset.n;
 if(n=='all')st.sel=[];else st.sel=st.sel.includes(n)?st.sel.filter(x=>x!=n):[...st.sel,n];st.card=null;st.q=null;st.flip=false;view()};
function toggle(el){el.classList.toggle('on')}
$('#main').onclick=e=>{const bl=e.target.closest('.b');if(bl){toggle(bl);return}
 const xb=e.target.closest('.xb');if(xb){const o=xb.getAttribute('aria-expanded')=='false';xb.setAttribute('aria-expanded',o);xb.textContent=o?'ซ่อนคำอธิบาย':'อธิบาย';document.getElementById('ex'+xb.dataset.x).classList.toggle('on',o);return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.o!==undefined&&st.q&&st.q.picked<0){const q=st.q;q.picked=+b.dataset.o;const sc=st.sc||(st.sc={r:0,w:0});if(q.picked==q.ans)sc.r++;else{sc.w++;st.lv[q.n]=1;save()}view();return}
 if(b.dataset.qt){st.qt=b.dataset.qt;st.q=newQ();view();return}
 if(b.dataset.q){st.q=newQ();view();return}
 if(b.dataset.a){const sec=b.closest('.sec');const n=sec.dataset.n;
  if(b.dataset.a=='all'){const bs=sec.querySelectorAll('.b');const all=[...bs].every(x=>x.classList.contains('on'));bs.forEach(x=>x.classList.toggle('on',!all))}
  else{st.lv[n]=+b.dataset.a;save();renderStats();renderChips();const t=sec.querySelector('.lv');t.className='lv l'+st.lv[n];t.textContent=LV[st.lv[n]]}}
 if(b.dataset.c){if(b.dataset.c=='show'){st.flip=true}else{st.lv[st.card]=+b.dataset.c;save();st.flip=false;st.card=pick()}view()}};
$('#main').onkeydown=e=>{if((e.key=='Enter'||e.key==' ')&&e.target.classList.contains('b')){e.preventDefault();toggle(e.target)}};
$('#rs').onclick=()=>{st.lv={};save();st.card=null;st.flip=false;view()};
view();
</script>
